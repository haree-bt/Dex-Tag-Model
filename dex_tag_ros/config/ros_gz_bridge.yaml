# Detachable Joint Trigger for Physical Grasp Transport
- ros_topic_name: "/model/ur5e_manipulator/detachable_joint/attach"
  gz_topic_name: "/model/ur5e_manipulator/detachable_joint/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

# Robot Joint States
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
