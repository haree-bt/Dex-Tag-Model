# Dex-TAG ROS 2 <-> Gazebo Harmonic Bridge Config
# Vision Sensors
- ros_topic_name: "/camera/image"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/depth_image"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Joint Position Commands (UR5e 6-DoF Arm)
- ros_topic_name: "/model/ur5e_manipulator/joint/shoulder_pan_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/shoulder_pan_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/ur5e_manipulator/joint/shoulder_lift_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/shoulder_lift_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/ur5e_manipulator/joint/elbow_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/elbow_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/ur5e_manipulator/joint/wrist_1_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/wrist_1_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/ur5e_manipulator/joint/wrist_2_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/wrist_2_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/ur5e_manipulator/joint/wrist_3_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/wrist_3_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Joint Position Commands (Dex-TAG 3-Finger Adaptive Hand)
- ros_topic_name: "/model/ur5e_manipulator/joint/finger_thumb_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/finger_thumb_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/ur5e_manipulator/joint/finger_index_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/finger_index_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/ur5e_manipulator/joint/finger_middle_joint/cmd_pos"
  gz_topic_name: "/model/ur5e_manipulator/joint/finger_middle_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
